<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 218" width="520" height="218">
  <title>Buzzer wiring D5 to ATmega328P</title>
  <desc>Passive buzzer: D5 through 100 ohm to buzzer plus; buzzer minus to GND.</desc>

  <text x="260" y="22" text-anchor="middle" fill="#333333" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Passive piezo buzzer, ATmega328P / Arduino D5</text>
  <text x="260" y="40" text-anchor="middle" fill="#444444" font-family="Arial,sans-serif" font-size="11">D5 = DIP pin 11 (PD5), 100 ohm series, common GND</text>

  <!-- MCU: pin labels above/beside pins, not on wire exit -->
  <rect x="24" y="68" width="120" height="92" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="2"/>
  <text x="84" y="96" text-anchor="middle" fill="#222222" font-family="Arial,sans-serif" font-size="13" font-weight="bold">ATmega328P</text>
  <text x="84" y="112" text-anchor="middle" fill="#444444" font-family="Arial,sans-serif" font-size="11">(standalone)</text>

  <text x="84" y="128" text-anchor="middle" fill="#444444" font-family="Arial,sans-serif" font-size="10">PD5 / pin 11</text>
  <circle cx="84" cy="140" r="6" fill="#c62828" stroke="#333333" stroke-width="1.5"/>
  <text x="84" y="143" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10" font-weight="bold">D5</text>

  <circle cx="84" cy="160" r="6" fill="#333333"/>

  <!-- Signal path at y=140 (clear of pin labels) -->
  <path d="M 90 140 L 160 140" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M 160 140 L 168 130 L 176 150 L 184 130 L 192 150 L 200 130 L 208 140 L 248 140" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="204" y="118" text-anchor="middle" fill="#222222" font-family="Arial,sans-serif" font-size="13">100 ohm</text>

  <path d="M 248 140 L 278 140" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Buzzer: label well above box; +/- offset from wires -->
  <text x="306" y="104" text-anchor="middle" fill="#444444" font-family="Arial,sans-serif" font-size="11">Buzzer</text>
  <rect x="278" y="118" width="56" height="44" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <line x1="286" y1="130" x2="326" y2="130" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="286" y1="140" x2="326" y2="140" stroke="#1565c0" stroke-width="1.5"/>
  <line x1="286" y1="150" x2="326" y2="150" stroke="#1565c0" stroke-width="1.5"/>

  <text x="262" y="136" fill="#1565c0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">+</text>
  <text x="338" y="150" fill="#1565c0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">-</text>

  <!-- Return: bottom of buzzer at y=162, jog to MCU GND branch -->
  <path d="M 306 162 L 306 178 L 84 178 L 84 166" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 84 178 L 84 186" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <g transform="translate(84,186)">
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="-9" y1="6" x2="9" y2="6" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="-4" y1="12" x2="4" y2="12" stroke="#1a1a1a" stroke-width="2.5"/>
  </g>
  <text x="102" y="208" text-anchor="start" fill="#444444" font-family="Arial,sans-serif" font-size="11">GND</text>

  <text x="400" y="95" fill="#444444" font-family="Arial,sans-serif" font-size="11">Passive 2-pin:</text>
  <text x="400" y="112" fill="#444444" font-family="Arial,sans-serif" font-size="11">polarity often</text>
  <text x="400" y="129" fill="#444444" font-family="Arial,sans-serif" font-size="11">does not matter.</text>
  <text x="400" y="155" fill="#444444" font-family="Arial,sans-serif" font-size="11">Code: tone(D5, 2000)</text>
</svg>
