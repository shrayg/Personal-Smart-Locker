<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Consolas, Arial, sans-serif" font-size="11">
  <style>
    .title { font-size:15px; font-weight:bold; fill:#222; }
    .sub { font-size:11px; fill:#555; }
    .lbl { font-size:10px; fill:#333; }
    .wire { stroke:#1565c0; stroke-width:2; fill:none; }
    .gnd { stroke:#222; stroke-width:2; fill:none; }
    .res { fill:#fff; stroke:#333; stroke-width:1.2; }
    .note { font-size:9px; fill:#666; }
  </style>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" class="title" text-anchor="middle">UI LEDs (Milestone 4b / 4c)</text>
  <text x="320" y="46" class="sub" text-anchor="middle">ATmega328P: D6 red, D7 green, D8 yellow - 220 ohm each, common GND</text>

  <!-- MCU block -->
  <rect x="40" y="70" width="120" height="100" rx="6" fill="#eceff1" stroke="#333" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ATmega328P</text>
  <text x="100" y="118" text-anchor="middle" class="lbl">DIP pins 12, 13, 14</text>
  <text x="100" y="138" text-anchor="middle" class="lbl">D6 / D7 / D8</text>

  <!-- D6 branch (x ~ 200) -->
  <circle cx="100" cy="155" r="5" fill="#c62828"/>
  <text x="118" y="158" class="lbl" fill="#c62828">D6</text>
  <path class="wire" d="M 105 155 L 160 155"/>
  <rect x="160" y="147" width="40" height="16" class="res" rx="2"/>
  <text x="180" y="159" text-anchor="middle" font-size="9">220</text>
  <path class="wire" d="M 200 155 L 200 168"/>
  <path d="M 200 168 L 192 178 L 208 178 Z" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <line x1="192" y1="182" x2="208" y2="182" stroke="#333" stroke-width="1.5"/>
  <path class="gnd" d="M 200 182 L 200 365"/>
  <text x="218" y="175" class="lbl">Red</text>

  <!-- D7 branch (x ~ 280) -->
  <circle cx="100" cy="230" r="5" fill="#2e7d32"/>
  <text x="118" y="233" class="lbl" fill="#2e7d32">D7</text>
  <path class="wire" d="M 105 230 L 240 230"/>
  <rect x="240" y="222" width="40" height="16" class="res" rx="2"/>
  <text x="260" y="234" text-anchor="middle" font-size="9">220</text>
  <path class="wire" d="M 280 230 L 280 243"/>
  <path d="M 280 243 L 272 253 L 288 253 Z" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3"/>
  <line x1="272" y1="257" x2="288" y2="257" stroke="#333" stroke-width="1.5"/>
  <path class="gnd" d="M 280 257 L 280 365"/>
  <text x="298" y="250" class="lbl">Green</text>

  <!-- D8 branch (x ~ 360) -->
  <circle cx="100" cy="305" r="5" fill="#f9a825"/>
  <text x="118" y="308" class="lbl" fill="#f9a825">D8</text>
  <path class="wire" d="M 105 305 L 320 305"/>
  <rect x="320" y="297" width="40" height="16" class="res" rx="2"/>
  <text x="340" y="309" text-anchor="middle" font-size="9">220</text>
  <path class="wire" d="M 360 305 L 360 318"/>
  <path d="M 360 318 L 352 328 L 368 328 Z" fill="#fff9c4" stroke="#f9a825" stroke-width="1.3"/>
  <line x1="352" y1="332" x2="368" y2="332" stroke="#333" stroke-width="1.5"/>
  <path class="gnd" d="M 360 332 L 360 365"/>
  <text x="378" y="325" class="lbl">Yellow</text>

  <!-- Common GND bus -->
  <line x1="160" y1="365" x2="400" y2="365" class="gnd"/>
  <line x1="150" y1="370" x2="410" y2="370" stroke="#222" stroke-width="3"/>
  <text x="415" y="369" class="lbl">GND</text>

  <text x="40" y="400" class="note">Resistor values in ohms. Use 220-470 ohm if LEDs are too bright. Cathode toward GND.</text>
</svg>
